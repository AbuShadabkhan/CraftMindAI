apiVersion: apps/v1
kind: Deployment
metadata:
  name: craftmindai-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: craftmindai-client
  template:
    metadata:
      labels:
        app: craftmindai-client
    spec:
      containers:
        - name: craftmindai-client
          image: craftmindai-client:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: craftmindai-client-service
spec:
  selector:
    app: craftmindai-client
  ports:
    - port: 80
      targetPort: 80
  type: NodePort